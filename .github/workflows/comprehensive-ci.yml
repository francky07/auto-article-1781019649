name: Comprehensive CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  schedule:
    - cron: '0 2 * * 0'

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: github/codeql-action/init@v2
        with:
          languages: 'cpp, csharp, go, java, javascript, python, ruby'
      - uses: github/codeql-action/analyze@v2
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: |
          if [ -f package.json ]; then npm install && npm run lint 2>/dev/null || true; fi
      - run: |
          if [ -f .prettierrc ] || [ -f .prettierrc.json ]; then npm install prettier -g && prettier --check . 2>/dev/null || true; fi

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov flake8 black
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics 2>/dev/null || true
          black --check . 2>/dev/null || true
          if [ -d tests ] || [ -f conftest.py ]; then pytest --cov=. --cov-report=xml 2>/dev/null || true; fi

  node-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['14', '16', '18', '20']
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: if [ -f package.json ]; then npm install && npm test 2>/dev/null || true; fi

  r-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: always()
      - uses: r-lib/actions/check-r-package@v2
        if: always()

  build:
    runs-on: ubuntu-latest
    needs: [code-quality, lint]
    steps:
      - uses: actions/checkout@v3
      - run: |
          mkdir -p dist/ && cp -r . dist/ 2>/dev/null || true
          tar -czf artifact-${{ github.sha }}.tar.gz dist/
      - uses: actions/upload-artifact@v3
        with:
          name: build-artifacts-${{ github.sha }}
          path: artifact-${{ github.sha }}.tar.gz
          retention-days: 30

  notify:
    runs-on: ubuntu-latest
    needs: [code-quality, lint, python-tests, node-tests, r-tests, build]
    if: always()
    steps:
      - run: |
          echo "## 🤖 CI/CD Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
